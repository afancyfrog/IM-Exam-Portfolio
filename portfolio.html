<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tanya Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mediaqueries.css">

<script src="js/nav.js" defer></script>
<script src="js/scroll.js" defer></script>
<script src="js/filter.js" defer></script>
</head>

<body data-nav-path=".">


    <div id="navbar"></div>



    <div class="projects-header">
        <h1>Projects</h1>

        <div class="filters">
            <!-- YEAR -->
            <div class="dropdown" data-filter="year">
                <button class="dropdown-btn">
                    <span class="dropdown-label">Year</span><span class="arrow">▾</span>
                </button>
                <div class="dropdown-menu">
                    <div class="dropdown-item" data-value="all">All Years</div>
                    <div class="dropdown-item" data-value="2026">2026</div>
                    <div class="dropdown-item" data-value="2025">2025</div>
                </div>
            </div>

            <!-- TYPE -->
            <div class="dropdown" data-filter="type">
                <button class="dropdown-btn">
                    <span class="dropdown-label">Type</span><span class="arrow">▾</span>
                </button>
                <div class="dropdown-menu">
                    <div class="dropdown-item" data-value="all">All Types</div>
                    <div class="dropdown-item" data-value="Course work">
                        Course Work
                    </div>
                    <div class="dropdown-item" data-value="Game jam">Game Jam</div>
                </div>
            </div>

            <!-- ROLE -->
            <div class="dropdown" data-filter="role">
                <button class="dropdown-btn">
                    <span class="dropdown-label">Role</span><span class="arrow">▾</span>
                </button>
                <div class="dropdown-menu">
                    <div class="dropdown-item" data-value="all">All Roles</div>
                    <div class="dropdown-item" data-value="Programmer">
                        Programmer
                    </div>
                    <div class="dropdown-item" data-value="All">All Rounder</div>
                </div>
            </div>

            <!-- TEAM SIZE -->
            <div class="dropdown" data-filter="teamSize">
                <button class="dropdown-btn">
                    <span class="dropdown-label">Team</span><span class="arrow">▾</span>
                </button>
                <div class="dropdown-menu">
                    <div class="dropdown-item" data-value="all">All</div>
                    <div class="dropdown-item" data-value="Solo-Build">Solo</div>
                    <div class="dropdown-item" data-value="2 people">Duo</div>
                    <div class="dropdown-item" data-value="3 people">3+</div>
                </div>
            </div>
        </div>
    </div>
    <div class="page-container">

        <div id="project-container"></div>

        <div id="no-results" class="no-results hidden">
            No projects found for these filters.
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <a href="./contact.html" class="contact-btn"> Contact </a>

            <p class="footer-text">
                Tanya Freese — South Africa — 2026
            </p>
        </div>
    </footer>
</body>

</html>
