<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tanya Portfolio</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/mediaqueries.css" />
    <script src="/js/nav.js" defer></script>
    <script src="/js/contact.js" defer></script>
    <script src="/js/scroll.js" defer></script>
</head>

<body data-nav-path=".">
    <div id="navbar"></div>

    <div class="projects-header">
        <h1>Contact Me</h1>
    </div>


    <div class="page-container">

        <section class="contact">

            <h1>Form</h1>

            <form class="contact-form" id="contact-form">

                <!-- NAME -->
                <div class="input-group">
                    <input type="text" id="name" placeholder="Name" />
                    <small class="feedback" id="name-feedback"></small>
                </div>

                <!-- EMAIL -->
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" />
                    <small class="feedback" id="email-feedback"></small>
                </div>

                <!-- MESSAGE -->
                <div class="input-group">
                    <textarea id="message" placeholder="Message"></textarea>
                    <small class="feedback" id="message-feedback"></small>
                </div>

                <!-- SUBMIT -->
                <button type="submit" id="submit-btn" disabled>
                    Send Message
                </button>

                <p class="success-message" id="success-message">
                    Message sent successfully!
                </p>

            </form>

        </section>

        </section>

        <section class="social-media">

            <a href="https://www.instagram.com/afancyfrog/" target="_blank" rel="noopener noreferrer"
                aria-label="Instagram">
                <img src="/assets/Instagram.png" alt=" Instagram">
            </a>

            <a href="https://www.youtube.com/@afancyfrog3476" target="_blank" rel="noopener noreferrer"
                aria-label="YouTube">
                <img src="/assets/YouTube.png" alt="YouTube">
            </a>

            <a href="https://afancyfrog.itch.io" target="_blank" rel="noopener noreferrer" aria-label="itch.io">
                <img src="/assets/Itch.png" alt="itch.io">
            </a>

        </section>

    </div>

    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <a href="/contact.html" class="contact-btn"> Contact </a>

            <p class="footer-text">Tanya Freese — South Africa — 2026</p>
        </div>
    </footer>
</body>

</html>
